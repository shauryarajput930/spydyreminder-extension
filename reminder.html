<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spydy Reminder Alert</title>
    <link rel="stylesheet" href="reminder.css" />
  </head>
  <body>
    <div class="popup-shell">
      <div class="window-bar" id="window-bar">
        <div class="window-title">Reminder</div>
        <div class="window-controls">
          <button id="close-button" class="window-btn" aria-label="Close">×</button>
        </div>
      </div>

      <div class="reminder-card">
        <div class="card-label">REMINDER</div>
        <div id="reminder-text" class="reminder-text">Time for your reminder</div>
        <button id="dismiss-button" class="dismiss-button">Dismiss</button>
      </div>

      <div class="hero-wrapper">
        <img
          src="images/spider-man-coming-down.png"
          alt="Spider-Man coming down"
          class="hero"
        />
      </div>
    </div>
    <script src="reminder.js"></script>
  </body>
</html>
